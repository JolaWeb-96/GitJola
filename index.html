<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recruit Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>RECRUIT APPLICANTS ONLY</h1>
    <form>
      <label for="Firstname"><strong>First Name</strong>:</label>
      <input type="text" name="First Name" placeholder="First Name Here" />
      <br />
      <br />
      <label for="Last Name"><strong>Last Name:</strong></label>
      <input type="text" name="Last Name" placeholder="Last Name Here" />
      <br />
      <br />
      <label for="Gender"><strong>Gender:</strong></label>
      <label for="Male">Male</label>
      <input type="checkbox" name="Male" id="Male" required />
      <label for="Female">Female</label>
      <input type="checkbox" name="Female" id="Female" required />
      <label for="Others">Others</label>
      <input type="checkbox" name="Other" id="Other" required />
      <br />
      <br />
      <label for="Email"><strong>Email:</strong></label>
      <input type="Email" name="Email" placeholder="email456@example.com" />
      <br />
      <br />
      <label for="Password"><strong>Password:</strong></label>
      <input type="text" name="Password" id="password" placeholder="password" />
      <br />
      <br />
       <label for="DOB"><strong>DOB</strong></label>
      <input type="numbers" name="numbers" id="numbers" placeholder="Date Of Birth" />
      <br />
      <br />
<label for="checkbox"><strong>I hereby plegde for the safety of my country</strong></label>
<input type="radio" name="radio" id="radio">
<br>
<br>
<input type="submit" value="Report">
  </body>
</html>
